<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Supply Prescript Dashboard</title>
 

    <style>
        body{
             margin:0;
             padding:30px;
             font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
             background:#0f172a;
             color:#ffffff;
        }

        h1{
            text-align:center;
            color:#ffffff;
            font-size:40px;
            margin-bottom:30px;
        }
        h2{
            color:white;
            margin-bottom:25px;
            font-size:24px;
        }

        h3{
             color:white;
             font-size:20px;
        }

        .container{
    max-width:1600px;
    margin:auto;
}

        .card{
    background:#1e293b;
    padding:20px;
    border-radius:12px;
    height:fit-content;
}
        label{
            display:block;
            margin-top:15px;
            margin-bottom:6px;
            color:#cbd5e1;
            font-weight:600;
            font-size:14px;
        }
     input,
select{
    width:100%;
    box-sizing:border-box;
    padding:12px;
    border-radius:8px;
    border:1px solid #334155;
    background:#0f172a;
    color:white;
}

        input:focus,
        select:focus{
            outline:none;
            border-color:#3b82f6;
            box-shadow:0 0 10px rgba(59,130,246,.35);
        }

        button{
            width:100%;
            padding:14px;
            margin-top:25px;
            border:none;
            border-radius:12px;
            background:linear-gradient(90deg,#7c3aed,#2563eb);
            color:white;
            font-size:16px;
            font-weight:600;
            cursor:pointer;
            transition:.3s;
        }

        button:hover{
            transform:translateY(-2px);
            box-shadow:0 10px 25px rgba(59,130,246,.45);
        }

        #result{
    margin-top:20px;
    padding:15px;
    background:#eef6ff;
    border-radius:6px;
    display:none;
    min-height:500px;
    width:100%;
}

        .low-risk {
           color: green;
           font-weight: bold;
       }

        .medium-risk {
           color: orange;
           font-weight: bold;
}

        .high-risk {
           color: red;
           font-weight: bold;
}
        .recommendation-card{
            margin-top:20px;
            padding:18px;
            background:#fef3c7;
            border-left:5px solid #f59e0b;
            border-radius:10px;
            color:#111827;
        }

        .recommendation-card h3,
        .recommendation-card strong,
        .recommendation-card p{
            color:#111827;
        }

        .recommendation-card strong{
            font-size:18px;
        }

        .recommendation-card p{
            margin-top:8px;
            margin-bottom:0;
        }
        .optimization-card {
    margin-top: 20px;
    padding: 20px;
    background: #f0fdf4;
    border-left: 5px solid #16a34a;
    border-radius: 10px;
    color: #111827;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
}

.optimization-card h3 {
    color: #111827;
    margin-top: 0;
    margin-bottom: 10px;
}

.optimization-card p {
    color: #374151;
}

.optimization-card strong {
    color: #111827;
}
        .execute-btn {
            margin-top: 15px;
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
}

        .execute-btn:disabled {
            cursor: not-allowed;
            opacity: 0.7;
}

        #executionMessage {
            margin-top: 10px;
            font-weight: bold;
}
        .alternatives-container{
    display:flex;
    gap:15px;
    margin-top:20px;
    width:100%;
}
.alternative-card {
    flex: 1;
    min-width: 180px;
    background: #ffffff;
    color: #111827;
    padding: 16px;
    border-radius: 10px;
    border: 1px solid #cbd5e1;
    box-sizing: border-box;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.alternative-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 12px rgba(0, 0, 0, 0.08);
}

.alternative-card h4 {
    color: #111827;
    margin-top: 0;
    margin-bottom: 10px;
}

.alternative-card p {
    color: #4b5563;
    margin: 7px 0;
}

.alternative-card strong {
    color: #111827;
}

/* Recommended option */
.alternative-card.recommended {
    background: #ecfdf5;
    border: 2px solid #22c55e;
}

.alternative-card.recommended h4 {
    color: #166534;
}

/* Infeasible option */
.alternative-card.infeasible {
    background: #fef2f2;
    border: 2px solid #ef4444;
}

.alternative-card.infeasible h4 {
    color: #991b1b;
}

@media (max-width: 800px) {
    .alternatives-container {
        grid-template-columns: 1fr;
    }
}
.analytics-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-top: 20px;
}

.analytics-item {
    background: #ffffff;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
    border: 1px solid #d1d5db;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.analytics-item:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 12px rgba(0, 0, 0, 0.08);
}

.analytics-item h3 {
    margin: 0;
    font-size: 26px;
    font-weight: 700;
    color: #111827;
}

.analytics-item p {
    margin: 8px 0 0;
    color: #4b5563;
    font-size: 14px;
    font-weight: 500;
}

/* Different colors for each metric */

.analytics-item:nth-child(1) h3 {
    color: #2563eb;
}

.analytics-item:nth-child(2) h3 {
    color: #16a34a;
}

.analytics-item:nth-child(3) h3 {
    color: #d97706;
}

.analytics-item:nth-child(4) h3 {
    color: #dc2626;
}

.analytics-item:nth-child(5) h3 {
    color: #7c3aed;
}

.analytics-item:nth-child(6) h3 {
    color: #0891b2;
}

.analytics-item:nth-child(7) h3 {
    color: #9333ea;
}

/* Responsive */

@media (max-width: 900px) {
    .analytics-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 500px) {
    .analytics-grid {
        grid-template-columns: 1fr;
    }
}

@media (max-width: 800px) {
    .analytics-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}
#analyticsResult{
    color:#111827;
}

#analyticsResult h3,
#analyticsResult p,
#analyticsResult strong{
    color:#111827;
}

.stats-grid{

    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:20px;

    margin:35px 0;

}

.stat-card{

    background:#1e293b;

    border:1px solid #334155;

    border-radius:15px;

    padding:25px;

    text-align:center;

    box-shadow:0 15px 30px rgba(0,0,0,.25);

}

.stat-card h3{

    font-size:34px;

    color:#38bdf8;

    margin:0;

}

.stat-card p{

    color:#cbd5e1;

    margin-top:10px;

}

@media(max-width:900px){

.stats-grid{

grid-template-columns:repeat(2,1fr);

}

}

@media(max-width:600px){

.stats-grid{

grid-template-columns:1fr;

}

}

.dashboard-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px;
    align-items:start;
}

.left-panel,
.right-panel{
    display:flex;
    flex-direction:column;
    gap:20px;
}

.right-panel .card{
    min-height:650px;
}

#result{
    min-height:600px;
}

@media(max-width:1000px){
    .dashboard-grid{
        grid-template-columns:1fr;
    }

    .right-panel .card{
        min-height:auto;
    }

    #result{
        min-height:auto;
    }
}

/* ==============================
   DECISION HISTORY - READABILITY
   ============================== */

.history-container {
    background: #ffffff;
    color: #1f2937;
    border-radius: 12px;
    padding: 20px;
    margin-top: 20px;
}

.history-container h3 {
    color: #111827;
}

.history-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
    background: #ffffff;
    color: #1f2937;
}

.history-table th {
    background: #4f46e5;
    color: #ffffff;
    padding: 12px;
    text-align: left;
    font-weight: 600;
}

.history-table td {
    padding: 11px 12px;
    border-bottom: 1px solid #e5e7eb;
    color: #374151;
    background: #ffffff;
}

.history-table tr:nth-child(even) td {
    background: #f8fafc;
}

.history-table tr:hover td {
    background: #eef2ff;
}

/* Decision ID */
.history-table td:first-child {
    font-weight: 600;
    color: #4f46e5;
}

/* Recommended Action */
.history-table td:nth-child(4) {
    color: #047857;
    font-weight: 600;
}

/* Cost */
.history-table td:nth-child(5) {
    font-weight: 600;
    color: #b45309;
}

/* Execution date */
.history-table td:last-child {
    color: #6b7280;
}


/* ==============================
   EVALUATION CARD
   ============================== */

.evaluation-card {
    background: #ffffff;
    color: #1f2937;
    border-radius: 12px;
    padding: 20px;
    margin-top: 20px;
}

.evaluation-card h3 {
    color: #111827;
}

.evaluation-card label {
    display: block;
    margin-top: 12px;
    margin-bottom: 5px;
    color: #374151;
    font-weight: 600;
}

.evaluation-card input {
    width: 100%;
    box-sizing: border-box;
    padding: 10px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    background: #ffffff;
    color: #111827;
}

.evaluation-card input:focus {
    outline: none;
    border-color: #4f46e5;
    box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.15);
}


/* ==============================
   EVALUATION RESULT
   ============================== */

#evaluationResult {
    margin-top: 15px;
    color: #1f2937;
}

#evaluationResult .success {
    background: #dcfce7;
    color: #166534;
    padding: 15px;
    border-radius: 8px;
}

#evaluationResult .warning {
    background: #fef3c7;
    color: #92400e;
    padding: 15px;
    border-radius: 8px;
}

#evaluationResult .danger {
    background: #fee2e2;
    color: #991b1b;
    padding: 15px;
    border-radius: 8px;
}

/* Prediction Result readability */
#result {
    color: #1f2937 !important;
}

#result h3 {
    color: #111827 !important;
    font-size: 18px;
}

#result p {
    color: #374151 !important;
    font-weight: 500;
}

#result p strong {
    color: #111827 !important;
}

/* Prediction label */
#result .prediction-label {
    font-weight: 700;
    color: #2563eb !important;
}

/* Delay probability */
#result .delay-probability {
    font-weight: 700;
    color: #7c3aed !important;
}

/* Risk levels */
#result .low-risk {
    color: #15803d !important;
    font-weight: 800;
}

#result .medium-risk {
    color: #d97706 !important;
    font-weight: 800;
}

#result .high-risk {
    color: #dc2626 !important;
    font-weight: 800;
}

.history-container {
    margin-top: 20px;
    padding: 20px;
    background: #1e293b;
    border-radius: 12px;
}

.history-container h3 {
    margin-bottom: 10px;
    color: #ffffff;
}

.history-total {
    color: #cbd5e1;
    margin-bottom: 15px;
}

.table-wrapper {
    width: 100%;
    overflow-x: auto;
}

.history-table {
    width: 100%;
    border-collapse: collapse;
    background: #f8fafc;
    color: #1e293b;
    border-radius: 8px;
    overflow: hidden;
}

.history-table th {
    background: #334155;
    color: #ffffff;
    padding: 12px;
    text-align: left;
    white-space: nowrap;
}

.history-table td {
    padding: 11px 12px;
    border-bottom: 1px solid #cbd5e1;
    white-space: nowrap;
}

.history-table tbody tr:hover {
    background: #e2e8f0;
}

.history-table td strong {
    color: #2563eb;
}
    </style>
</head>

<body>

<div class="container">

    <div class="stats-grid">

        <div class="stat-card">
            <h3>1250</h3>
            <p>Total Shipments</p>
        </div>

        <div class="stat-card">
            <h3>68</h3>
            <p>High Risk</p>
        </div>

        <div class="stat-card">
            <h3>98%</h3>
            <p>Success Rate</p>
        </div>

        <div class="stat-card">
            <h3>£82K</h3>
            <p>Total Savings</p>
        </div>

    </div>

    <h1>🚚 Supply Prescript</h1>

    <div class="dashboard-grid">

        <!-- LEFT PANEL -->
        <div class="left-panel">

            <div class="card">

                <h2>Shipment Delay Prediction</h2>

                <label>Days for Shipment (Scheduled)</label>
                <input type="number" id="scheduled_days" value="4">

                <label>Shipping Mode</label>
                <select id="shipping_mode">
                    <option value="Standard Class">Standard Class</option>
                    <option value="Second Class">Second Class</option>
                    <option value="First Class">First Class</option>
                    <option value="Same Day">Same Day</option>
                </select>

                <label>Order Item Quantity</label>
                <input type="number" id="quantity" value="1">

                <label>Sales</label>
                <input type="number" id="sales" value="100">

                <label>Product Price</label>
                <input type="number" id="price" value="50">

                <label>Market</label>
                <input type="text" id="market" value="USCA">

                <label>Order Region</label>
                <input type="text" id="region" value="West">

                <label>Category Name</label>
                <input type="text" id="category" value="Sporting Goods">

                <label>Customer Segment</label>
                <input type="text" id="segment" value="Consumer">

                <label>Department Name</label>
                <input type="text" id="department" value="Fan Shop">

                <label>Order Year</label>
                <input type="number" id="year" value="2017">

                <label>Order Month</label>
                <input type="number" id="month" value="6">

                <label>Order Day</label>
                <input type="number" id="day" value="15">

                <label>Order Weekday</label>
                <input type="text" id="weekday" value="Thursday">

                <label>Order Country</label>
                <input type="text" id="country" value="United States">

                <label>Order State</label>
                <input type="text" id="state" value="California">

                <button onclick="predictDelay()">
                    Predict Shipment Delay
                </button>

            </div>

        </div>

        <!-- RIGHT PANEL -->
        <div class="right-panel">

            <div class="card">

                <h2>Prediction & Optimization</h2>

                <div id="result">

                    <div class="placeholder">
                        <h3>No Prediction Yet</h3>
                        <p>
                            Fill the shipment details and click
                            <strong>Predict Shipment Delay</strong>
                            to view the prediction.
                        </p>
                    </div>

                </div>

            </div>

        </div>

    </div>
        <!-- Decision Analytics Section -->
        <div class="card" id="analyticsCard">

            <h2>Decision Analytics</h2>

            <button onclick="loadDecisionAnalytics()">
                Load Decision Analytics
            </button>

            <div id="analyticsResult"></div>

        </div>

    </div>

</div>

<script>

async function predictDelay() {

    const data = {

        "Days for shipment (scheduled)": Number(
            document.getElementById("scheduled_days").value
        ),

        "Shipping Mode":
            document.getElementById("shipping_mode").value,

        "Order Item Quantity": Number(
            document.getElementById("quantity").value
        ),

        "Sales": Number(
            document.getElementById("sales").value
        ),

        "Product Price": Number(
            document.getElementById("price").value
        ),

        "Market":
            document.getElementById("market").value,

        "Order Region":
            document.getElementById("region").value,

        "Category Name":
            document.getElementById("category").value,

        "Customer Segment":
            document.getElementById("segment").value,

        "Department Name":
            document.getElementById("department").value,

        "Order Year": Number(
            document.getElementById("year").value
        ),

        "Order Month": Number(
            document.getElementById("month").value
        ),

        "Order Day": Number(
            document.getElementById("day").value
        ),

        "Order Weekday":
            document.getElementById("weekday").value,

        "Order Country":
            document.getElementById("country").value,

        "Order State":
            document.getElementById("state").value
    };

    try {

        const response = await fetch(
            "http://127.0.0.1:8000/predict",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(data)
            }
        );

        const result = await response.json();

        const resultBox = document.getElementById("result");

        resultBox.style.display = "block";

       const delayProbability = result.delay_probability * 100;

let riskLevel;
let riskClass;

if (delayProbability < 30) {
    riskLevel = "LOW RISK";
    riskClass = "low-risk";
} else if (delayProbability < 60) {
    riskLevel = "MEDIUM RISK";
    riskClass = "medium-risk";
} else {
    riskLevel = "HIGH RISK";
    riskClass = "high-risk";
}

resultBox.innerHTML = `
    <h3>Prediction Result</h3>

    <p>
       <strong>Prediction:</strong>
<span class="prediction-label">
    ${result.prediction_label}
</span>
    </p>

    <p>
      <strong>Delay Probability:</strong>
<span class="delay-probability">
    ${delayProbability.toFixed(2)}%
</span>
    </p>

    <p>
        <strong>Risk Level:</strong>
        <span class="${riskClass}">${riskLevel}</span>
    </p>

    <div class="recommendation-card">
        <strong>Recommended Action</strong>
        <p>${result.recommendation}</p>
    </div>

    <div class="optimization-card">

    <h3>Prescriptive Optimization</h3>

    <p>
        <strong>Recommended Action:</strong>
        ${result.optimization.selected_action}
    </p>

    <p>
        <strong>Estimated Cost:</strong>
        £${result.optimization.selected_cost.toLocaleString()}
    </p>

    <p>
        <strong>Expected Delay:</strong>
        ${result.optimization.selected_delay_days} days
    </p>

    <p>
        <strong>Available Capacity:</strong>
        ${result.optimization.selected_capacity} units
    </p>

    <h3>Optimization Alternatives</h3>

    <div class="alternatives-container">

        ${result.optimization.alternatives.map(option => `

            <div class="alternative-card
                ${option.recommended ? 'recommended' : ''}
                ${!option.feasible ? 'infeasible' : ''}">

                <h4>
                    ${option.action}

                    ${option.recommended
                        ? ' ⭐ Recommended'
                        : ''}
                </h4>

                <p>
                    <strong>Cost:</strong>
                    £${option.cost.toLocaleString()}
                </p>

                <p>
                    <strong>Delay:</strong>
                    ${option.delay_days} days
                </p>

                <p>
                    <strong>Capacity:</strong>
                    ${option.capacity} units
                </p>

                <p>
                    <strong>Status:</strong>

                    ${option.feasible
                        ? '✓ Feasible'
                        : '✗ Not Feasible'}
                </p>

            </div>

        `).join('')}

    </div>

    <button id="executeDecisionBtn" class="execute-btn">
        Execute Recommended Decision
    </button>

    <p id="executionMessage"></p>

</div>
`;

document.getElementById("executeDecisionBtn").addEventListener("click", async () => {

    const button = document.getElementById("executeDecisionBtn");
    const message = document.getElementById("executionMessage");

    button.disabled = true;
    button.textContent = "Executing...";

    try {

        const decisionData = {
         Shipment_ID: 1002,
         Predicted_Delay: result.optimization.selected_delay_days,
         Recommended_Action: result.optimization.selected_action,
         Predicted_Cost: result.optimization.selected_cost
};

        const response = await fetch(
            "http://127.0.0.1:8000/execute-decision",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(decisionData)
            }
        );

        if (!response.ok) {
            throw new Error("Failed to execute decision");
        }

       const executionResult = await response.json();

message.innerHTML = `
    ✓ Decision executed and saved successfully!
    <br>
    <strong>Decision ID:</strong>
    ${executionResult.decision_id}
`;

button.textContent = "Decision Executed";

    } catch (error) {

        console.error(error);

        message.textContent =
            "✗ Unable to execute decision.";

        button.disabled = false;
        button.textContent = "Execute Decision";
    }
});

    } catch (error) {

        alert(
            "Unable to connect to the Supply Prescript API. " +
            "Make sure FastAPI is running."
        );

        console.error(error);
    }
}
async function loadDecisionAnalytics() {
    const analyticsResult = document.getElementById("analyticsResult");

    analyticsResult.innerHTML = "Loading analytics...";

    try {

        const response = await fetch(
            "http://127.0.0.1:8000/decision-analytics"
        );

        if (!response.ok) {
            throw new Error("Failed to load analytics");
        }

        const data = await response.json();

        analyticsResult.innerHTML = `

            <div class="optimization-card">

                <h3>Decision Analytics Results</h3>

                <p>
                    <strong>Total Decisions:</strong>
                    ${data.total_decisions}
                </p>

                <p>
                    <strong>Total Cost:</strong>
                    £${Number(data.total_cost).toLocaleString()}
                </p>

                <p>
                    <strong>Average Predicted Delay:</strong>
                    ${data.average_predicted_delay} days
                </p>

                <p>
                    <strong>Most Recommended Action:</strong>
                    ${data.most_recommended_action}
                </p>

            </div>

            <div class="card">

                <h2>🔄 Closed-Loop Decision Performance</h2>
                <div class="card">

    <h2>📋 Decision History</h2>

    <button
        type="button"
        onclick="loadDecisionHistory()"
    >
        Load Decision History
    </button>

    <div id="decisionHistory">
        Click the button to view executed decisions.
    </div>

</div>

                <div id="feedbackAnalytics">
                    Loading feedback analytics...
                </div>
                 
                <div class="evaluation-card">

    <h3>📊 Evaluate Executed Decision</h3>

    <label>Decision ID</label>
    <input
        type="number"
        id="evaluationDecisionId"
        placeholder="Enter decision ID"
    >

    <label>Actual Delay (days)</label>
    <input
        type="number"
        id="actualDelay"
        step="0.1"
        placeholder="Enter actual delay"
    >

    <label>Actual Cost (£)</label>
    <input
        type="number"
        id="actualCost"
        step="0.01"
        placeholder="Enter actual cost"
    >

    <button
        type="button"
        onclick="evaluateDecision()"
    >
        Evaluate Decision
    </button>

    <div id="evaluationResult"></div>

</div>
                <br>

               <button type="button" onclick="retrainModel()">
    🔄 Retrain Model
</button>

<div id="retrainResult"></div>
            </div>

        `;

        // Load feedback analytics after HTML is created
        await loadFeedbackAnalytics();

    } catch (error) {

        console.error(error);

        analyticsResult.innerHTML =
            "Unable to load decision analytics.";
    }
}
async function loadFeedbackAnalytics() {

    try {

        const response = await fetch(
            "http://127.0.0.1:8000/feedback-analytics"
        );

        if (!response.ok) {
            throw new Error("Unable to load feedback analytics");
        }

        const data = await response.json();

        const analyticsBox =
            document.getElementById("feedbackAnalytics");

        analyticsBox.innerHTML = `

            <div class="analytics-grid">

                <div class="analytics-item">
                    <h3>${data.total_evaluated}</h3>
                    <p>Total Evaluated</p>
                </div>

                <div class="analytics-item">
                    <h3>${data.successful}</h3>
                    <p>Successful</p>
                </div>

                <div class="analytics-item">
                    <h3>${data.partially_successful}</h3>
                    <p>Partially Successful</p>
                </div>

                <div class="analytics-item">
                    <h3>${data.unsuccessful}</h3>
                    <p>Unsuccessful</p>
                </div>

                <div class="analytics-item">
                    <h3>${data.success_rate}%</h3>
                    <p>Success Rate</p>
                </div>

                <div class="analytics-item">
                    <h3>£${Number(data.average_cost_difference).toLocaleString()}</h3>
                    <p>Average Cost Difference</p>
                </div>

                <div class="analytics-item">
                    <h3>${data.average_delay_difference} days</h3>
                    <p>Average Delay Difference</p>
                </div>

            </div>
        `;

    } catch (error) {

        console.error(error);

        const analyticsBox =
            document.getElementById("feedbackAnalytics");

        if (analyticsBox) {
            analyticsBox.textContent =
                "Unable to load feedback analytics.";
        }
    }
}

async function evaluateDecision() {

    const decisionId =
        Number(document.getElementById("evaluationDecisionId").value);

    const actualDelay =
        Number(document.getElementById("actualDelay").value);

    const actualCost =
        Number(document.getElementById("actualCost").value);

    const resultBox =
        document.getElementById("evaluationResult");

    if (!decisionId || actualDelay < 0 || actualCost < 0) {

        resultBox.innerHTML = `
            <p style="color:#f87171;">
                Please enter valid evaluation details.
            </p>
        `;

        return;
    }

    resultBox.innerHTML = "Evaluating decision...";

    try {

        const response = await fetch(
            "http://127.0.0.1:8000/evaluate-decision",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    decision_id: decisionId,
                    actual_delay: actualDelay,
                    actual_cost: actualCost
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.detail || data.error || "Evaluation failed"
            );
        }

        resultBox.innerHTML = `
            <div class="recommendation-card">

                <h4>✅ Decision Evaluated</h4>

                <p>
                    <strong>Outcome:</strong>
                    ${data.outcome}
                </p>

                <p>
                    <strong>Delay Difference:</strong>
                    ${data.delay_difference} days
                </p>

                <p>
                    <strong>Cost Difference:</strong>
                    £${Number(
                        data.cost_difference
                    ).toLocaleString()}
                </p>

            </div>
        `;

        // Refresh Closed-Loop Analytics
        await loadFeedbackAnalytics();

        // Clear inputs
        document.getElementById(
            "evaluationDecisionId"
        ).value = "";

        document.getElementById(
            "actualDelay"
        ).value = "";

        document.getElementById(
            "actualCost"
        ).value = "";

    } catch (error) {

        console.error(error);

        resultBox.innerHTML = `
            <p style="color:#f87171;">
                ❌ ${error.message}
            </p>
        `;
    }
}

async function retrainModel() {

    console.log("Retrain button clicked");

    const resultBox = document.getElementById("retrainResult");

    if (!resultBox) {
        console.error("retrainResult not found");
        return;
    }

    resultBox.innerHTML = `
        <div class="optimization-card">
            <h3>🔄 Retraining Model...</h3>
            <p>Please wait...</p>
        </div>
    `;

    try {

        const response = await fetch(
            "http://127.0.0.1:8000/retrain-model",
            {
                method: "POST"
            }
        );

        console.log("Response status:", response.status);

        if (!response.ok) {
            throw new Error("Retraining failed");
        }

        const data = await response.json();

        console.log("Retrain response:", data);

        resultBox.innerHTML = `
            <div class="optimization-card">

                <h3>✅ Model Retrained Successfully</h3>

                <p>
                    <strong>Version:</strong>
                    ${data.model_version}
                </p>

                <p>
                    <strong>Accuracy:</strong>
                    ${data.accuracy}%
                </p>

                <p>
                    ${data.message}
                </p>

            </div>
        `;

        console.log("Retrain result displayed");

    } catch (error) {

        console.error("Retrain Error:", error);

        resultBox.innerHTML = `
            <div class="recommendation-card">

                <h3>❌ Retrain Failed</h3>

                <p>${error.message}</p>

            </div>
        `;
    }
}

async function loadDecisionHistory() {

    const historyBox = document.getElementById("decisionHistory");

    historyBox.innerHTML = "Loading decision history...";

    try {

        const response = await fetch(
            "http://127.0.0.1:8000/decision-history"
        );

        if (!response.ok) {
            throw new Error("Failed to load decision history");
        }

        const data = await response.json();

        if (data.decisions.length === 0) {
            historyBox.innerHTML = "<p>No executed decisions found.</p>";
            return;
        }

        historyBox.innerHTML = `

            <div class="history-container">

                <h3>📋 Decision History</h3>

                <p class="history-total">
                    <strong>Total Decisions:</strong>
                    ${data.total_decisions}
                </p>

                <div class="table-wrapper">

                    <table class="history-table">

                        <thead>
                            <tr>
                                <th>Decision ID</th>
                                <th>Shipment ID</th>
                                <th>Predicted Delay</th>
                                <th>Recommended Action</th>
                                <th>Predicted Cost</th>
                                <th>Execution Date</th>
                            </tr>
                        </thead>

                        <tbody>

                            ${data.decisions.map(decision => `

                                <tr>

                                    <td>
                                        <strong>#${decision.decision_id}</strong>
                                    </td>

                                    <td>
                                        ${decision.shipment_id}
                                    </td>

                                    <td>
                                        ${decision.predicted_delay} days
                                    </td>

                                    <td>
                                        ${decision.recommended_action}
                                    </td>

                                    <td>
                                        £${Number(
                                            decision.predicted_cost
                                        ).toLocaleString()}
                                    </td>

                                    <td>
                                        ${decision.execution_date}
                                    </td>

                                </tr>

                            `).join('')}

                        </tbody>

                    </table>

                </div>

            </div>
        `;

    } catch (error) {

        console.error(error);

        historyBox.innerHTML =
            "<p>Unable to load decision history.</p>";
    }
}
</script>

</body>
</html>
