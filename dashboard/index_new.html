<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Supply Prescript Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Segoe UI',sans-serif;
background:#0f172a;
color:white;
padding:30px;
}

.container{
max-width:1600px;
margin:auto;
}

h1{
font-size:38px;
margin-bottom:30px;
text-align:center;
}

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',sans-serif;
    background:#0f172a;
    color:white;
    padding:30px;
}

.container{
    max-width:1600px;
    margin:auto;
}

h1{
    font-size:38px;
    margin-bottom:30px;
    text-align:center;
}

/* 👇 PASTE THE KPI CSS HERE */

.stats-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
    margin-bottom:30px;
}

.stat-card{
    background:#1e293b;
    padding:25px;
    border-radius:15px;
    text-align:center;
    border:1px solid #334155;
}

.stat-card h2{
    color:#38bdf8;
    font-size:32px;
    margin-bottom:10px;
}

.stat-card p{
    color:#cbd5e1;
    font-size:15px;
}

@media(max-width:900px){
    .stats-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:600px){
    .stats-grid{
        grid-template-columns:1fr;
    }
}

</style>

</style>

</head>

<body>

<div class="container">

<h1>🚚 Supply Prescript</h1>

<div class="stats-grid">

    <div class="stat-card">
        <h2>1250</h2>
        <p>Total Shipments</p>
    </div>

    <div class="stat-card">
        <h2>68</h2>
        <p>High Risk</p>
    </div>

    <div class="stat-card">
        <h2>98%</h2>
        <p>Success Rate</p>
    </div>

    <div class="stat-card">
        <h2>£82K</h2>
        <p>Total Savings</p>
    </div>

</div>

</div>

</body>

</html>
